[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
env =
    TESTING=true
addopts =
    -v
    --strict-markers
    --cov=api
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=60
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
