# render.yaml - Blueprint para deploy no Render
# Docs: https://docs.render.com/blueprint-spec

services:
  # API Principal - FastAPI
  - type: web
    name: fiap-tech-challenge-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fiap-tech-challenge-db
          property: connectionString
      - key: PYTHON_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SCRAPER_LIMIT
        value: "10"

  # Dashboard Streamlit
  - type: web
    name: fiap-tech-challenge-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile.dashboard
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: fiap-tech-challenge-api
          property: hostport

# Banco de Dados PostgreSQL
databases:
  - name: fiap-tech-challenge-db
    plan: free
    region: oregon
    databaseName: tech_challenge
    user: tech_challenge_user
