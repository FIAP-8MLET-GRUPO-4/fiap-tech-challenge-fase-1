name: CD - Deploy to Render

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI - Tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Só faz deploy se o CI passou (ou se for push direto na main)
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "⚠️ RENDER_API_KEY ou RENDER_SERVICE_ID não configurados."
            echo "📝 Para ativar deploy automático, adicione estes secrets no GitHub:"
            echo "   - RENDER_API_KEY: Sua API key do Render"
            echo "   - RENDER_SERVICE_ID: ID do serviço no Render"
            echo ""
            echo "🔗 Enquanto isso, o Render fará deploy via webhook automático."
            exit 0
          fi

          echo "🚀 Triggering deploy no Render..."
          curl -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'
          echo "✅ Deploy iniciado com sucesso!"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Report status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Pipeline completo! Deploy realizado com sucesso."
          else
            echo "⚠️ Deploy falhou ou foi ignorado. Verifique os logs."
          fi
